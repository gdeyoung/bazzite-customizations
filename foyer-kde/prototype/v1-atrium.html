<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer KDE — V1 Atrium</title>
<style>
:root{
  --win:rgba(35,38,41,.96); --raised:#31363b; --raised2:#3b4045;
  --hover:rgba(61,174,233,.13); --sel:rgba(30,146,255,.24);
  --tx:#fcfcfc; --dim:#a1a9b1; --faint:#78828b;
  --accent:#1e92ff; --accent-hi:#3daee9;
  --pos:#27ae60; --neg:#da4453; --neu:#f67400;
  --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.13);
  --rw:14px; --rc:10px; --ri:7px;
  --mono:'Noto Sans Mono',ui-monospace,monospace;
  --sans:'Noto Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);font-size:17px;color:var(--tx);
  background:
    radial-gradient(1200px 700px at 30% 20%,#1c2733 0%,transparent 60%),
    radial-gradient(900px 600px at 75% 80%,#232030 0%,transparent 55%),
    #0c0f13;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
/* faint desktop suggestion behind the overlay */
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(1.4px 1.4px at 22% 34%,#ffffff26 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 68% 61%,#ffffff1c 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 45% 82%,#ffffff14 50%,transparent 51%);
  opacity:.5;pointer-events:none}
.window{
  width:920px;height:640px;border-radius:var(--rw);
  background:var(--win);border:1px solid var(--bd2);
  box-shadow:0 30px 90px rgba(0,0,0,.6),0 4px 18px rgba(0,0,0,.45);
  backdrop-filter:blur(22px);
  display:flex;flex-direction:column;overflow:hidden;
  animation:open .13s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes open{from{opacity:0;transform:scale(.982)}to{opacity:1;transform:scale(1)}}
/* ── header ─────────────────────────────────── */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.hdr .lens{flex:0 0 auto;color:var(--faint)}
.field{flex:1;display:flex;align-items:baseline;gap:8px;height:40px;
  border-bottom:2px solid var(--bd2)}
.field.focus{border-color:var(--accent)}
#q{flex:1;background:none;border:none;outline:none;color:var(--tx);
  font:400 17px/1 var(--mono);caret-color:var(--accent)}
#q::placeholder{color:var(--faint)}
.field .scope{font:500 13px/1 var(--mono);color:var(--accent-hi);
  letter-spacing:.02em;white-space:nowrap}
/* ── body split ─────────────────────────────── */
.body{flex:1;display:flex;min-height:0}
.rail{width:296px;flex:0 0 auto;border-right:1px solid var(--bd);
  overflow-y:auto;padding:8px 8px 12px}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
/* ── rail tree ──────────────────────────────── */
.grp{font:600 11px/1 var(--mono);color:var(--faint);letter-spacing:.14em;
  padding:14px 10px 6px}
.row{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;
  border-radius:var(--ri);cursor:default;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row.sel::before{content:'';position:absolute;left:0;top:8px;bottom:8px;
  width:3px;border-radius:2px;background:var(--accent)}
.row .ic{flex:0 0 22px;display:flex;justify-content:center;color:var(--dim)}
.row.sel .ic{color:var(--accent-hi)}
.row .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:16px}
.row .lbl small{display:block;font-size:12px;color:var(--faint);line-height:1.25;
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n{font:500 12px/1 var(--mono);color:var(--faint);padding-left:6px}
.kids{margin:2px 0 4px 15px;padding-left:12px;border-left:1px solid var(--bd)}
.kids .row{height:36px}
/* ── pane ───────────────────────────────────── */
.pane-hdr{display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;
  border-bottom:1px solid var(--bd)}
.crumbs{display:flex;align-items:center;gap:7px;font:500 13px/1 var(--mono);
  color:var(--dim)}
.crumbs b{color:var(--tx);font-weight:600;font-size:14px}
.crumbs .sep{color:var(--faint)}
.pane-hdr .cnt{margin-left:auto;font:500 12px/1 var(--mono);color:var(--faint)}
.scroll{flex:1;overflow-y:auto;padding:10px 14px 16px}
/* list rows in pane */
.prow{display:flex;align-items:center;gap:12px;min-height:44px;padding:5px 10px;
  border-radius:var(--ri)}
.prow:hover{background:var(--hover)}
.prow.sel{background:var(--sel);box-shadow:inset 0 0 0 1.5px rgba(30,146,255,.55)}
.tile{flex:0 0 30px;height:30px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font:600 14px/1 var(--sans);color:#fff}
.prow .meta{flex:1;min-width:0}
.prow .meta .nm{font-size:16.5px;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.prow .meta .sub{font-size:12.5px;color:var(--dim);line-height:1.3;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .act{font:500 11.5px/1 var(--mono);color:var(--faint);letter-spacing:.06em;
  white-space:nowrap}
.prow.warn .act{color:var(--neu)}
.footer-note{font:500 12px/1 var(--mono);color:var(--faint);text-align:center;
  padding:14px 0 4px;letter-spacing:.08em}
/* favorites strip */
.favh{font:600 11px/1 var(--mono);color:var(--faint);letter-spacing:.14em;
  padding:10px 10px 8px}
.favs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 4px 6px}
.fav{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px 9px;
  border-radius:var(--ri);border:1px solid transparent}
.fav:hover{background:var(--hover)}
.fav .tile{width:34px;height:34px;font-size:16px}
.fav .fn{font-size:12px;color:var(--dim);line-height:1.15;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* category tiles */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 4px}
.cat{display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:rgba(49,54,59,.55);border:1px solid var(--bd);border-radius:var(--ri)}
.cat:hover{background:var(--hover)}
.cat .ci{color:var(--dim)}
.cat .cl{flex:1;font-size:15px}
.cat .n{font:500 12px/1 var(--mono);color:var(--faint)}
/* AI card */
.ai-ask{display:flex;align-items:center;gap:10px;background:var(--raised);
  border:1px solid var(--bd2);border-radius:var(--rc);padding:12px 14px;
  font:400 15px/1.4 var(--mono);color:var(--dim)}
.ai-ask .pf{color:var(--accent-hi);font-weight:600}
.qcard{background:var(--raised);border:1px solid var(--bd2);border-radius:var(--rc);
  padding:16px 18px;margin-top:12px}
.qcard .q{font:600 14px/1.5 var(--mono);color:var(--accent-hi);margin-bottom:10px}
.qcard .a{font-size:15.5px;line-height:1.55;color:var(--tx)}
.qcard .a .cur{display:inline-block;width:8px;height:16px;background:var(--accent);
  vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.qcard .aa{display:flex;gap:8px;margin-top:14px}
.chipbtn{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--bd2);border-radius:6px;padding:7px 12px}
.chipbtn:hover{color:var(--tx);border-color:var(--accent)}
.chipbtn.pri{color:#fff;background:var(--accent);border-color:transparent}
.model-chip{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--mono);
  color:var(--dim);border:1px solid var(--bd2);border-radius:99px;padding:6px 12px}
.model-chip .dot{width:7px;height:7px;border-radius:99px;background:var(--pos)}
/* peers */
.prow .st{flex:0 0 8px;height:8px;border-radius:99px;margin-right:2px}
.st.on{background:var(--pos)} .st.dimmed{background:var(--faint)}
/* empty */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--dim)}
.empty .big{font-size:17px}
.empty .kbd-hint{font:500 12px/1 var(--mono);color:var(--faint);letter-spacing:.1em}
/* ── footer ─────────────────────────────────── */
.ftr{display:flex;align-items:center;height:36px;padding:0 18px;gap:14px;
  border-top:1px solid var(--bd);font:500 11.5px/1 var(--mono);
  color:var(--faint);letter-spacing:.07em}
.ftr .grow{flex:1}
kbd{border:1px solid var(--bd2);border-radius:4px;padding:2.5px 5.5px;
  color:var(--dim);font:500 10.5px/1 var(--mono);margin-right:2px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="window" id="win">
  <div class="hdr">
    <span class="lens"><svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg></span>

<script>

const IC={

};
/* ── real data (extracted from live .desktop scan + fleet) ── */

const HUES=['#1e92ff','#27ae60','#f67400','#9b59b6','#da4453','#1abc9c','#3daee9','#c9ce3b'];
function tile(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;
  return `<span class="tile" style="background:linear-gradient(145deg,${HUES[h%8]},${HUES[(h+3)%8]}cc)">${name[0].toUpperCase()}</span>`}

 {id:'apps',lbl:'Apps',ic:'apps',n:250,sub:'FAVORITES · ALL CATEGORIES · THE FULL TREE'},

 {id:'fleet',lbl:'Fleet',ic:'fleet',n:12,sub:'PEERS · HANDOFFS'},

const $=id=>document.getElementById(id);
function railRow(t,depth,selected,cat){
 return `<div class="row ${selected?'sel':''}" data-id="${t.id}" ${depth?`data-cat="${t.lbl}"`:''} tabindex="-1">
  <span class="ic">${IC[t.ic]}</span><span class="lbl">${t.lbl}</span><span class="n">${t.n||''}</span></div>`}
function renderRail(filter){
  const f=(filter||'').toLowerCase();

    if(t.id==='apps'&&(expanded.apps||f)){
      h+='<div class="kids">';
      h+=`<div class="row ${sel.rail==='favs'?'sel':''}" data-id="favs"><span class="ic">${IC.star}</span><span class="lbl">Favorites</span><span class="n">27</span></div>`;
      const cats=Object.keys(CATS).filter(c=>!f||c.toLowerCase().includes(f));
      for(const c of cats)h+=`<div class="row ${sel.rail===c?'sel':''}" data-cat="${c}"><span class="ic">${IC[catIcon[c]]}</span><span class="lbl">${c}</span><span class="n">${CATS[c].length}</span></div>`;
      h+=`<div class="row" data-id="more"><span class="ic">${IC.apps}</span><span class="lbl" style="color:var(--dim)">More categories</span><span class="n">4</span></div>`;
      h+='</div>';
    }
  }
  h+='<div class="grp">FLEET</div>';
  for(const t of LANE)h+=railRow(t,0,sel.rail===t.id);
  $('rail').innerHTML=h;
}
function paneCat(c){
  const apps=CATS[c];
  $('crumbs').innerHTML=`<span>Apps</span><span class="sep">›</span><b>${c}</b>`;
  $('cnt').textContent=`${apps.length} OF ${apps.length}`;
  $('scroll').innerHTML=apps.map((a,i)=>`<div class="prow ${i===0?'sel':''}">
    ${tile(a)}<div class="meta"><div class="nm">${a}</div><div class="sub">${GEN[a]||c.replace(/s$/,'')+' application'}</div></div>
    <div class="act">ENTER LAUNCHES</div></div>`).join('');
}
function paneApps(){
  $('crumbs').innerHTML=`<b>Apps</b>`;
  $('cnt').textContent='250 APPS · 12 CATS';
  let h=`<div class="favh">FAVORITES · KICKOFF MIRROR</div><div class="favs">`+
    FAVS.map(f=>`<div class="fav">${tile(f[0])}<span class="fn">${f[0]}</span></div>`).join('')+`</div>
    <div class="favh" style="padding-top:14px">CATEGORIES</div><div class="cats">`+
    Object.keys(CATS).map(c=>`<div class="cat" data-cat="${c}"><span class="ci">${IC[catIcon[c]]}</span><span class="cl">${c}</span><span class="n">${CATS[c].length}</span></div>`).join('')+`</div>
    <div class="footer-note">MORE CATEGORIES · 4</div>`;
  $('scroll').innerHTML=h;
}
function paneNode(id){
  if(id==='favs'){$('crumbs').innerHTML=`<span>Apps</span><span class="sep">›</span><b>Favorites</b>`;$('cnt').textContent='27 FAVORITES';
    $('scroll').innerHTML=FAVS.concat([['Steam','Game launcher'],['Brave','Web browser'],['Kate','Text editor'],['calibre','E-book library'],['Gwenview','Image viewer'],['OBS Studio','Streaming and recording'],['Signal','Private messenger'],['VLC','Media player'],['Inkscape','Vector graphics'],['Blender','3D creation'],['Discord','Voice and chat'],['Joplin','Note taking'],['HandBrake','Video transcoder'],['mpv Media Player','Media player'],['Lutris','Game launcher'],['Transmission','BitTorrent client'],['Thunderbird','Email'],['Ark','Archive manager'],['Bottles','Windows apps'],['Cemu AppImage','Emulator'],['Dolphin Emulator','Emulator'],['EmuDeck','Emulation frontend'],['Easy Effects','Audio effects'],['Haruna','Video player']]).slice(0,14).map((f,i)=>`<div class="prow ${i===0?'sel':''}">${tile(f[0])}<div class="meta"><div class="nm">${f[0]}</div><div class="sub">${f[1]}</div></div><div class="act">ENTER LAUNCHES</div></div>`).join('')+`<div class="footer-note">SHOWING 14 OF 27</div>`;return}
  if(id==='settings'){$('crumbs').innerHTML=`<b>Settings</b>`;$('cnt').textContent='83 MODULES';
    $('scroll').innerHTML=KCMS.map((k,i)=>`<div class="prow ${i===0?'sel':''}"><span class="ic" style="color:var(--dim)">${IC.settings}</span><div class="meta"><div class="nm">${k}</div></div><div class="act">ENTER OPENS MODULE</div></div>`).join('')+`<div class="footer-note">SHOWING 21 OF 83 · TYPE LETTERS TO FILTER</div>`;return}
  if(id==='system'){$('crumbs').innerHTML=`<b>System</b>`;$('cnt').textContent='5 ACTIONS';
    $('scroll').innerHTML=POWER.map((p,i)=>`<div class="prow ${i===0?'sel':''} warn"><span class="ic" style="color:var(--dim)">${IC[p[1]]}</span><div class="meta"><div class="nm">${p[0]}</div></div><div class="act">${p[2]}</div></div>`).join('');return}
  if(id==='update'){$('crumbs').innerHTML=`<b>Update</b>`;$('cnt').textContent='ACTION';
    $('scroll').innerHTML=`<div class="prow sel warn"><span class="ic" style="color:var(--dim)">${IC.update}</span><div class="meta"><div class="nm">Run ujust update</div><div class="sub">OPENS IN KONSOLE · SYSTEM-WIDE</div></div><div class="act">ENTER STARTS NOW</div></div>`;return}
  if(id==='about'){$('crumbs').innerHTML=`<b>About</b>`;$('cnt').textContent='SUMMARY';
    $('scroll').innerHTML=`<div class="qcard"><div class="q" style="color:var(--dim)">GDTOWER · BAZZITE 42 · PLASMA 6.7.5 · KERNEL 6.2.15-ogc1 · AMD RX 9070 XT · UP 3D 14H</div><div class="aa"><span class="chipbtn pri">ENTER COPIES</span></div></div>`;return}
  if(id==='ai'){$('crumbs').innerHTML=`<b>AI</b>`;$('cnt').textContent='LOCAL-FAST';
    $('scroll').innerHTML=`<div class="ai-ask"><span class="pf">ai</span><span id="aiq" style="color:var(--tx)">${$('q').value?($('q').value):'type a question — ENTER asks · local-fast'}</span></div>
    <div class="qcard" id="ans" style="display:${$('q').value?'block':'none'}"><div class="q">ai ${$('q').value||''}</div><div class="a">On Plasma 6, a standalone QML window anchors as a Wayland overlay via LayerShellQt — the same path KRunner's own view uses. Blur comes from the KWin blur role on the window surface<span class="cur"></span></div><div class="aa"><span class="chipbtn pri">COPY</span><span class="chipbtn">CONTINUE IN CHAT</span><span class="chipbtn">MODEL · LOCAL-FAST ▾</span></div></div>
    <div class="favh" style="padding-top:14px">RECENT QUESTIONS</div>`+
    RECENTS.map(r=>`<div class="prow"><span class="ic" style="color:var(--dim)">${IC.ai}</span><div class="meta"><div class="nm" style="font-family:var(--mono);font-size:13.5px;color:var(--dim)">${r}</div></div><div class="act">ENTER RE-ASKS</div></div>`).join('');
    return}
  if(id==='fleet'){$('crumbs').innerHTML=`<b>Fleet</b>`;$('cnt').textContent='12 PEERS · 10 UP';
    $('scroll').innerHTML=PEERS.map((p,i)=>`<div class="prow ${i===0?'sel':''}"><span class="st ${p[2]==='on'?'on':'dimmed'}"></span><div class="meta"><div class="nm">${p[0]}</div><div class="sub">${p[1]}</div></div><div class="act">${p[2]==='on'?'ENTER HANDS OFF':'OFFLINE'}</div></div>`).join('');return}
  if(id==='ssh'){$('crumbs').innerHTML=`<b>SSH</b>`;$('cnt').textContent='9 ALIASES';
    $('scroll').innerHTML=SSH.map((s,i)=>`<div class="prow ${i===0?'sel':''}"><span class="ic" style="color:var(--dim)">${IC.ssh}</span><div class="meta"><div class="nm" style="font-family:var(--mono)">${s[0]}</div><div class="sub">${s[1]}</div></div><div class="act">ENTER CONNECTS</div></div>`).join('');return}
  if(id==='snippets'){$('crumbs').innerHTML=`<b>Snippets</b>`;$('cnt').textContent='5 SAVED';
    $('scroll').innerHTML=SNIPS.map((s,i)=>`<div class="prow ${i===0?'sel':''}"><span class="ic" style="color:var(--dim)">${IC.snip}</span><div class="meta"><div class="nm" style="font-family:var(--mono)">${s[0]}</div><div class="sub">${s[1]}</div></div><div class="act">ENTER COPIES</div></div>`).join('');return}
  if(id==='help'){$('crumbs').innerHTML=`<b>Help</b>`;$('cnt').textContent='LANES';
    $('scroll').innerHTML=[['ai — ask a question','type a question or prefix with ai'],['hr — hand Hermes a task','hr <task> · replies as notification'],['ssh <alias>','connect to a fleet host'],[';name','copy a saved snippet'],['apps','browse the full tree']]
    .map((s,i)=>`<div class="prow ${i===0?'sel':''}"><span class="ic" style="color:var(--dim)">${IC.help}</span><div class="meta"><div class="nm" style="font-family:var(--mono);font-size:14px">${s[0]}</div><div class="sub">${s[1]}</div></div></div>`).join('');return}
}
function paneFor(id){ if(CATS[id]){paneCat(id);return} paneNode(id)||0 }
function filterAll(v){
  const f=v.toLowerCase().trim();
  if(!f){renderRail('');paneFor(sel.rail);return}
  renderRail(f);
  const hits=[];
  for(const[c,arr]of Object.entries(CATS))for(const a of arr)if(a.toLowerCase().includes(f))hits.push(['APPS · '+c,a,'ENTER LAUNCHES']);
  for(const k of KCMS)if(k.toLowerCase().includes(f))hits.push(['SETTINGS',k,'ENTER OPENS MODULE']);
  for(const s of SSH)if(s[0].includes(f))hits.push(['SSH',s[0],'ENTER CONNECTS']);
  for(const s of SNIPS)if(s[0].includes(f))hits.push(['SNIPPETS',s[0],'ENTER COPIES']);
  hits.push(['AI','Ask Hermes: '+v,'ENTER ASKS · LOCAL-FAST']);
  if(!hits.length){
    $('crumbs').innerHTML=`<b>Search</b>`;$('cnt').textContent='';
    $('scroll').innerHTML=`<div class="empty"><div class="big">No matches for “${v}”</div><div class="kbd-hint"><kbd>ESC</kbd> CLEARS · <kbd>ENTER</kbd> ASKS AI ANYWAY</div></div>`;
    return}
  const bySec={};for(const h of hits)(bySec[h[0]]=bySec[h[0]]||[]).push(h);
  let h='';for(const[sec,arr]of Object.entries(bySec)){
    h+=`<div class="favh">${sec} · ${arr.length}</div>`+arr.slice(0,8).map((x,i)=>`<div class="prow ${sec==='AI'?'sel':''}">${/APPS/.test(sec)?tile(x[1]):`<span class="ic" style="color:var(--dim)">${IC.ai}</span>`}<div class="meta"><div class="nm" ${/AI|SSH|SNIPPETS/.test(sec)?'style="font-family:var(--mono);font-size:14.5px"':''}>${x[1]}</div></div><div class="act">${x[2]}</div></div>`).join('');
    if(arr.length>8)h+=`<div class="footer-note">SHOWING 8 OF ${arr.length}</div>`}
  $('crumbs').innerHTML=`<b>Search</b>`;$('cnt').textContent=`${hits.length} RESULTS`;
  $('scroll').innerHTML=h;
}
/* interactions */
$('rail').addEventListener('click',e=>{
  const r=e.target.closest('.row');if(!r)return;
  const cat=r.dataset.cat,id=r.dataset.id;
  if(cat){sel.rail=cat;renderRail($('q').value.trim());paneCat(cat)}
  else if(id){sel.rail=id;renderRail('');paneNode(id);
    if(id==='ai')filterAll($('q').value)}});
$('scroll').addEventListener('click',e=>{
  const c=e.target.closest('.cat');if(c){sel.rail=c.dataset.cat;renderRail('');paneCat(c.dataset.cat)}});
$('q').addEventListener('input',e=>{
  const v=e.target.value;
  $('scope').textContent=v?'':'';
  if(sel.rail==='ai')paneNode('ai');else filterAll(v)});
$('q').addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.target.value='';filterAll('');}});
$('field').addEventListener('click',()=>$('q').focus());
/* boot: Apps expanded, Games selected — shows fan-out + pane lens */
sel.rail='Games';
renderRail('');paneCat('Games');
setTimeout(()=>$('q').focus(),50);
</script>
