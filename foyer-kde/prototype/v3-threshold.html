<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer KDE — V3 Threshold</title>
<style>
:root{
  --win:rgba(35,38,41,.96); --raised:#31363b;
  --hover:rgba(61,174,233,.13); --sel:rgba(30,146,255,.24);
  --tx:#fcfcfc; --dim:#a1a9b1; --faint:#78828b;
  --accent:#1e92ff; --accent-hi:#3daee9;
  --pos:#27ae60; --neg:#da4453; --neu:#f67400;
  --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.13);
  --rw:14px; --ri:8px;
  --mono:'Noto Sans Mono',ui-monospace,monospace;
  --sans:'Noto Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:17px;color:var(--tx);
  background:radial-gradient(1200px 700px at 30% 20%,#1c2733 0%,transparent 60%),
  radial-gradient(900px 600px at 75% 80%,#232030 0%,transparent 55%),#0c0f13;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.window{width:920px;height:640px;border-radius:var(--rw);background:var(--win);
  border:1px solid var(--bd2);box-shadow:0 30px 90px rgba(0,0,0,.6),0 4px 18px rgba(0,0,0,.45);
  backdrop-filter:blur(22px);display:flex;flex-direction:column;overflow:hidden;
  animation:open .13s cubic-bezier(.2,.9,.3,1) both}
@keyframes open{from{opacity:0;transform:scale(.982)}to{opacity:1;transform:scale(1)}}
.hdr{padding:16px 22px 0}
.field{display:flex;align-items:center;gap:12px;height:46px;border-bottom:2px solid var(--bd2)}
.field.focus{border-color:var(--accent)}
.field .lens{color:var(--faint)}
#q{flex:1;background:none;border:none;outline:none;color:var(--tx);
  font:400 18px/1 var(--mono);caret-color:var(--accent)}
#q::placeholder{color:var(--faint);font-size:16px}
/* scope chips */
.chips{display:none;align-items:center;gap:8px;padding:10px 2px 12px;font:500 13px/1 var(--mono)}
.chips.on{display:flex}
.chips .sc{color:var(--accent-hi);display:flex;align-items:center;gap:8px}
.chips .sc::after{content:'›';color:var(--faint)}
.chips .sc:last-child::after{content:''}
.chips .flt{color:var(--dim)}
.chips .clr{margin-left:auto;color:var(--faint);border:1px solid var(--bd2);border-radius:6px;padding:5px 9px;font-size:11px;letter-spacing:.06em}
.chips .clr:hover{color:var(--tx);border-color:var(--accent)}
/* the list */
.list{flex:1;overflow-y:auto;padding:4px 14px 12px}
.sect{font:600 11px/1 var(--mono);color:var(--faint);letter-spacing:.14em;
  padding:14px 12px 6px;display:flex;align-items:baseline;gap:10px}
.sect .n{color:var(--accent-hi);letter-spacing:0}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 12px;border-radius:var(--ri);position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row.sel::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.row .ic{flex:0 0 22px;display:flex;justify-content:center;color:var(--dim)}
.row.sel .ic{color:var(--accent-hi)}
.row .meta{flex:1;min-width:0}
.row .nm{font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font:500 11.5px/1.35 var(--mono);color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.row .sub b{color:var(--neu);font-weight:600}
.row .n{font:500 12.5px/1 var(--mono);color:var(--faint)}
.row .go{color:var(--faint);flex:0 0 auto;transition:transform .12s ease}
.row.open .go{transform:rotate(90deg);color:var(--accent-hi)}
/* nested fan-out */
.kids{margin:1px 0 6px 20px;padding-left:14px;border-left:1px solid var(--bd);
  animation:unfold .14s cubic-bezier(.2,.9,.3,1) both}
@keyframes unfold{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.kids .row{min-height:40px}
.kids .row .nm{font-size:15.5px}
.kids .row .sub{font-size:10.5px}
.kids .kids{margin:1px 0 4px 18px}
.tile{flex:0 0 26px;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--sans);color:#fff}
/* AI answer card inline */
.aicard{margin:2px 0 8px 34px;background:var(--raised);border:1px solid var(--bd2);
  border-radius:10px;padding:14px 16px;animation:unfold .14s both}
.aicard .q{font:600 13px/1.5 var(--mono);color:var(--accent-hi);margin-bottom:9px}
.aicard .a{font-size:15px;line-height:1.55}
.aicard .cur{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.aicard .aa{display:flex;gap:8px;margin-top:12px}
.chipbtn{font:500 11.5px/1 var(--mono);letter-spacing:.08em;color:var(--dim);border:1px solid var(--bd2);border-radius:6px;padding:6px 11px}
.chipbtn:hover{color:var(--tx);border-color:var(--accent)}
.chipbtn.pri{color:#fff;background:var(--accent);border-color:transparent}
/* status/empty */
.empty{padding:70px 0;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--dim)}
.empty .kbd-hint{font:500 12px/1 var(--mono);color:var(--faint);letter-spacing:.1em}
.tail{font:500 11.5px/1 var(--mono);color:var(--faint);text-align:center;padding:12px 0 6px;letter-spacing:.08em}
.ftr{display:flex;align-items:center;height:36px;padding:0 20px;gap:14px;border-top:1px solid var(--bd);
  font:500 11.5px/1 var(--mono);color:var(--faint);letter-spacing:.07em}
.ftr .grow{flex:1}
kbd{border:1px solid var(--bd2);border-radius:4px;padding:2.5px 5.5px;color:var(--dim);font:500 10.5px/1 var(--mono);margin-right:2px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
</style>
</head>
<body>
<div class="window">
  <div class="hdr">
    <div class="field"><span class="lens"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg></span><input id="q" placeholder="Search everything · type to filter the tree · just ask for AI" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="ftr">
    <span>FOYER · 250 APPS · 12 CATS · 83 MODULES · 12 PEERS</span><span class="grow"></span>
    <span><kbd>↑↓</kbd>WALK</span><span><kbd>→</kbd>EXPAND</span><span><kbd>ENTER</kbd>OPEN</span><span><kbd>⌫</kbd>FOLD</span><span><kbd>ESC</kbd>CLOSE</span>
  </div>
</div>
<script>
const S=(d)=>`<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={
apps:S('<rect x="1.8" y="1.8" width="5" height="5" rx="1.4"/><rect x="9.2" y="1.8" width="5" height="5" rx="1.4"/><rect x="1.8" y="9.2" width="5" height="5" rx="1.4"/><rect x="9.2" y="9.2" width="5" height="5" rx="1.4"/>'),
star:S('<path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.2L8 11.5l-3.8 2 .7-4.2-3.1-3 4.3-.6z"/>'),
settings:S('<path d="M1.5 4h13M1.5 8h13M1.5 12h13"/><circle cx="5" cy="4" r="1.5" fill="#232629"/><circle cx="10.5" cy="8" r="1.5" fill="#232629"/><circle cx="6" cy="12" r="1.5" fill="#232629"/>'),
system:S('<path d="M8 1.8v5M8 6.9a4.6 4.6 0 1 1-4.6 4.6"/>'),
update:S('<path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3"/>'),
about:S('<circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4"/><circle cx="8" cy="4.7" r=".2" fill="currentColor"/>'),
ai:S('<path d="M8 1.5l1.7 4.8L14.5 8l-4.8 1.7L8 14.5 6.3 9.7 1.5 8l4.8-1.7z"/>'),
fleet:S('<circle cx="8" cy="2.8" r="1.6"/><circle cx="2.8" cy="12.8" r="1.6"/><circle cx="13.2" cy="12.8" r="1.6"/><path d="M7 4.1 3.6 11.3M9 4.1l3.4 7.2M4.4 12.8h7.2"/>'),
ssh:S('<rect x="1.5" y="2.5" width="13" height="11" rx="1.8"/><path d="M4.2 6l2.4 2-2.4 2M8.4 10.3h3.4"/>'),
snip:S('<path d="M5.5 2.5c-1.8 0-2 1.2-2 2.6v1.6c0 1.2-.6 2-1.5 2.3.9.3 1.5 1.1 1.5 2.3v1.6c0 1.4.2 2.6 2 2.6M10.5 2.5c1.8 0 2 1.2 2 2.6v1.6c0 1.2.6 2 1.5 2.3-.9.3-1.5 1.1-1.5 2.3v1.6c0 1.4-.2 2.6-2 2.6"/>'),
help:S('<circle cx="8" cy="8" r="6.2"/><path d="M6.2 6.2c.2-1.4 3.4-1.6 3.6 0 .2 1.4-1.8 1.5-1.8 3"/><circle cx="8" cy="11.6" r=".2" fill="currentColor"/>'),
game:S('<path d="M5.4 4.5H3.6A2.1 2.1 0 0 0 1.5 6.6v2.8a2.1 2.1 0 0 0 2.1 2.1h1.8l1.2-1.6h2.8l1.2 1.6h1.8a2.1 2.1 0 0 0 2.1-2.1V6.6a2.1 2.1 0 0 0-2.1-2.1h-1.8L9.6 6.1H6.4z"/><path d="M4.4 7v2M3.4 8h2"/>'),
net:S('<circle cx="8" cy="8" r="6.2"/><path d="M1.9 8h12.2M8 1.8c-3.6 3.8-3.6 8.6 0 12.4M8 1.8c3.6 3.8 3.6 8.6 0 12.4"/>'),
dev:S('<path d="M4.5 3.5 1 8l3.5 4.5M11.5 3.5 15 8l-3.5 4.5M9.4 2.6l-2.8 10.8"/>'),
media:S('<circle cx="8" cy="8" r="6.2"/><path d="M8 5.2 11 8 8 10.8 5 8z"/>'),
office:S('<path d="M3 1.8h7l3 3v9.4H3z"/><path d="M10 1.8v3h3M5.4 8.4h5.2M5.4 11h5.2"/>'),
sys2:S('<rect x="1.8" y="3" width="12.4" height="8" rx="1.6"/><path d="M5.5 13.5h5"/>'),
gfx:S('<circle cx="5.6" cy="5.6" r="2.6"/><circle cx="10.4" cy="10.4" r="2.6"/>'),
util:S('<circle cx="8" cy="8" r="2"/><path d="M8 1.8v12.4M1.8 8h12.4" transform="rotate(45 8 8)"/>'),
lock:S('<rect x="3.2" y="7" width="9.6" height="7" rx="1.6"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7"/>'),
sleep:S('<path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/>'),
out:S('<path d="M6 2.5H3A1.5 1.5 0 0 0 1.5 4v8A1.5 1.5 0 0 0 3 13.5h3M10.5 4.5 14 8l-3.5 3.5M14 8H6"/>'),
reb:S('<path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c2.2 0 4 1.2 4.9 3M13.5 1.5v3.6h-3.6"/>'),
off:S('<circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.6 1.6"/>'),
chev:S('<path d="M6 3.5 10.5 8 6 12.5"/>')};
const CATS={'Games':['9 Kings','Ad Fundum','After Inc: Revival','Age of Mythology: Retold','Avorion','Beyond All Reason','Boneraiser Minions','Brotato','Cemu AppImage','Dolphin Emulator','EmuDeck','Heroic Games Launcher','Lutris','Steam'],
'Internet':['Angry IP Scanner','Brave','Chromium','Discord','Firefox','Google Chrome','Greenlight','JDownloader','KDE Connect','KopiaUI','Signal','Thunderbird','Transmission','Warp'],
'Development':['Antigravity','Goose','Kate','KDebugSettings','LM-Studio','Podman Desktop','Sysprof','Whaler','ZCode','Builder'],
'Audio & Video':['Audacity','Buzz','Easy Effects','FileBot','HandBrake','Haruna','JamesDSP','Kdenlive','Media Downloader','mpv Media Player','OBS Studio','pwvucontrol','Sonixd','VLC'],
'Office':['Adobe Reader 9','calibre','Clearvoice','Collabora Office','E-book editor','E-book viewer','Joplin','LibreOffice','LibreOffice Calc','LibreOffice Writer','OnlyOffice'],
'System Tools':['Bazzite Portal','Bazzite Updater','Bitwarden','Btrfs Assistant','Cardwire','Dolphin','Fan Control','Fedora Media Writer','Firewall','Firmware','GParted','Htop','KDiskMark','Konsole'],
'Graphics':['Blender','Comic Reader Ultimate','Gwenview','Inkscape','Okular','Peek'],
'Utilities':['4KTUBE','AnythingLLM Desktop','Ark','balenaEtcher','Bazaar','Bold Brew','Bottles','BoxBuddy','Claude','CoolerControl']};
const catIcon={'Games':'game','Internet':'net','Development':'dev','Audio & Video':'media','Office':'office','System Tools':'sys2','Graphics':'gfx','Utilities':'util'};
const GEN={'Brotato':'Arena roguelite horde survival','Avorion':'Sandbox space sim','Beyond All Reason':'Large-scale RTS','Kdenlive':'Video editor','Dolphin':'File manager','Firefox':'Web browser','Brave':'Web browser','Kate':'Text editor','Bitwarden':'Password manager','Blender':'3D creation suite','Inkscape':'Vector graphics editor','Steam':'Game store and launcher','Konsole':'Terminal emulator','calibre':'E-book library','OBS Studio':'Streaming and recording','HandBrake':'Video transcoder','Gwenview':'Image viewer','VLC':'Media player'};
const KCMS=['About this System','Accessibility','Activities','Animations','Application Permissions','Application Style','Audio CDs','Autostart','Background Services','Bluetooth','Breeze Window Decoration','Colors and Themes','Cursors','Date and Time','Desktop Effects','Displays','Energy Saving','Fonts','Input Devices','KRunner','Keyboard Shortcuts'];
const PEERS=[['AICube','Agent fleet · LiteLLM · MCP','on'],['AITower','2× RTX 3090 · ComfyUI','on'],['AI Box','Unraid · embeddings · STT','on'],['MediaServer','Qwen3.8-27B · Emby','on'],['Watertower','SearXNG · ES','on'],['NAS','TrueNAS · bulk','on'],['Spark GX10','VELO pool','on'],['Spark GX13','VELO pool','on'],['Spark2','GLM-5.3-Flash','on'],['Node','General compute','off'],['HomeServer','Unraid apps','on'],['Jellyfin','Media :8096','off']];
const POWER=[['Lock Screen','lock','ENTER LOCKS NOW'],['Sleep','sleep','ENTER SLEEPS NOW'],['Log Out','out','ENTER LOGS OUT · <b>CLOSES OPEN APPS</b>'],['Reboot','reb','ENTER REBOOTS · <b>CLOSES OPEN APPS</b>'],['Shut Down','off','ENTER SHUTS DOWN · <b>CLOSES OPEN APPS</b>']];
const SSH=[['aitower','root@192.168.1.246'],['aicube','root@192.168.1.243'],['aibox','root@192.168.1.239'],['watertower','root@192.168.1.249'],['nas','root@192.168.1.252'],['mediaserver','root@192.168.1.250'],['jellyfin','gdeyoung@192.168.1.238'],['micro','gdeyoung@192.168.1.240'],['spark','gdeyoung@192.168.1.245']];
const SNIPS=[[';gpush','git push origin kde-ports-batch'],[';rwatch','journalctl --user -f -u hermes-runner'],[';gpull','git pull --rebase origin kde-ports-batch'],[';ports','ss -tlnp | grep 4000'],[';fl','fleet-status --all']];
const HUES=['#1e92ff','#27ae60','#f67400','#9b59b6','#da4453','#1abc9c','#3daee9','#c9ce3b'];
const tile=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;
 return `<span class="tile" style="background:linear-gradient(145deg,${HUES[h%8]},${HUES[(h+3)%8]}cc)">${n[0].toUpperCase()}</span>`};
const $=id=>document.getElementById(id);
let expanded={};   // id -> true
let selId='apps';
/* row builders */
function branchRow(id,ic,nm,sub,n,kidsHtml,sel,open){
 return `<div class="row ${sel?'sel':''} ${kidsHtml?'open':''}" data-id="${id}"><span class="ic">${IC[ic]}</span>
 <div class="meta"><div class="nm">${nm}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>
 ${n!=null?`<span class="n">${n}</span>`:''}<span class="go">${IC.chev}</span></div>${kidsHtml||''}`}
function leafRow(id,icOrTile,nm,sub,act,warn){
 return `<div class="row" data-id="${id}">${icOrTile}<div class="meta"><div class="nm">${nm}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>${act?`<span class="sub" style="color:${warn?'var(--neu)':'var(--faint)'}">${act}</span>`:''}</div>`}
/* apps subtree */
function appsKids(f){
 const fs=(f||'').toLowerCase();
 let h='<div class="kids">';
 h+=branchRow('favs','star','Favorites','KICKOFF MIRROR · READ-ONLY · PRUNE IN KICKOFF',27,
   expanded.favs?`<div class="kids">${['Dolphin · File manager','Firefox · Web browser','Konsole · Terminal','Kdenlive · Video editor','Bitwarden · Vault','Steam · Games','Brave · Web browser','Kate · Text editor'].slice(0,6).map(x=>{const[n,s]=x.split(' · ');return leafRow('',' ',n,s)}).join('')}<div class="tail">SHOWING 6 OF 27</div></div>`:'');
 for(const c of Object.keys(CATS)){
  if(fs&&!c.toLowerCase().includes(fs)&&!CATS[c].some(a=>a.toLowerCase().includes(fs)))continue;
  const filtered=fs?CATS[c].filter(a=>a.toLowerCase().includes(fs)):CATS[c];
  if(!filtered.length)continue;
  const kids=expanded[c]?`<div class="kids">${filtered.map(a=>leafRow('',tile(a),a,GEN[a]||'Application')).join('')}</div>`:'';
  h+=branchRow(c,catIcon[c],c,`${CATS[c].length} APPS`,CATS[c].length,kids)}
 h+=leafRow('more',' ','More categories','NETWORK · SYSTEM · GRAPHICS · UTILITIES · …');
 return h+'</div>'}
function rootList(f){
 const fs=(f||'').toLowerCase().trim();
 let h=`<div class="sect">LAUNCHER</div>`;
 h+=branchRow('apps','apps','Apps','FAVORITES · ALL CATEGORIES · THE FULL TREE',250,expanded.apps?appsKids(fs):'',selId==='apps'||expanded.apps);
 if(!fs){
  h+=branchRow('settings','settings','Settings','SYSTEM SETTINGS MODULES · TYPE TO FILTER',83,expanded.settings?`<div class="kids">${KCMS.slice(0,8).map(k=>leafRow('',IC.settings,k,'','ENTER OPENS')).join('')}<div class="tail">SHOWING 8 OF 83</div></div>`:'');
  h+=branchRow('system','system','System','LOCK · SLEEP · LOG OUT · REBOOT · SHUT DOWN',5,expanded.system?`<div class="kids">${POWER.map(p=>leafRow('',IC[p[1]],p[0],'',p[2],true)).join('')}</div>`:'');
  h+=leafRow('update',IC.update,'Update','RUNS UJUST UPDATE IN KONSOLE','ENTER STARTS NOW');
  h+=leafRow('about',IC.about,'About','SYSTEM SUMMARY','ENTER COPIES');
  h+=`<div class="sect">FLEET · HERMES</div>`;
  h+=branchRow('ai','ai','AI','ASK A QUESTION · RECENTS · MODEL local-fast',null,expanded.ai?aiKids():'');
  h+=branchRow('fleet','fleet','Fleet','PEERS · HANDOFFS · STATUS',12,expanded.fleet?`<div class="kids">${PEERS.map(p=>leafRow('',`<span class="st" style="width:8px;height:8px;border-radius:99px;background:${p[2]==='on'?'var(--pos)':'var(--faint)'}"></span>`,p[0],p[1],p[2]==='on'?'ENTER HANDS OFF':'OFFLINE')).join('')}</div>`:'');
  h+=branchRow('ssh','ssh','SSH','HOST ALIASES · TYPE THE NAME',9,expanded.ssh?`<div class="kids">${SSH.map(s=>leafRow('',IC.ssh,s[0],s[1],'ENTER CONNECTS')).join('')}</div>`:'');
  h+=branchRow('snippets','snip','Snippets',';NAME · ENTER COPIES · ;NEW SAVES',5,expanded.snippets?`<div class="kids">${SNIPS.map(s=>leafRow('',IC.snip,s[0],s[1],'ENTER COPIES')).join('')}</div>`:'');
  h+=leafRow('help',IC.help,'Help','LANE DOCS · EXAMPLES · GRAMMAR');
 } else {
  /* typed: flat sections across everything */
  const hitsA=[],hitsS=[],hitsP=[];
  for(const[c,arr]of Object.entries(CATS))for(const a of arr)if(a.toLowerCase().includes(fs))hitsA.push([c,a]);
  for(const k of KCMS)if(k.toLowerCase().includes(fs))hitsS.push(k);
  for(const p of PEERS)if(p[0].toLowerCase().includes(fs))hitsP.push(p);
  h=`<div class="sect">APPS <span class="n">${hitsA.length}</span></div>`+
   hitsA.slice(0,8).map(x=>leafRow('',tile(x[1]),x[1],(GEN[x[1]]||x[0]+' application').toUpperCase(),'ENTER LAUNCHES')).join('')+
   (hitsA.length>8?`<div class="tail">SHOWING 8 OF ${hitsA.length} · TYPE TO NARROW</div>`:'')+
   (hitsS.length?`<div class="sect">SETTINGS <span class="n">${hitsS.length}</span></div>`+hitsS.slice(0,5).map(k=>leafRow('',IC.settings,k,'','ENTER OPENS')).join(''):'')+
   (hitsP.length?`<div class="sect">FLEET <span class="n">${hitsP.length}</span></div>`+hitsP.map(p=>leafRow('',IC.fleet,p[0],p[1],p[2]==='on'?'ENTER HANDS OFF':'OFFLINE')).join(''):'');
  h+=`<div class="sect">AI</div>`+leafRow('ask',IC.ai,`Ask Hermes: ${f}`,'STREAMS IN PLACE · local-fast','ENTER ASKS');
  if(!hitsA.length&&!hitsS.length&&!hitsP.length){
   h=`<div class="empty"><div>No matches for “${f}”</div><div class="kbd-hint"><kbd>ESC</kbd> CLEARS · <kbd>ENTER</kbd> ASKS AI ANYWAY</div></div><div class="sect">AI</div>`+leafRow('ask',IC.ai,`Ask Hermes: ${f}`,'','ENTER ASKS')}
 }
 return h}
function aiKids(){
 return `<div class="kids">`+
 leafRow('ask',IC.ai,'Ask a question','TYPE IN THE FIELD · STREAMS IN PLACE · ENTER ASKS')+
 (expanded.ask?`<div class="aicard"><div class="q">ai how do I anchor a QML window as an overlay on KWin?</div><div class="a">Use LayerShellQt: anchor top-center, take keyboard focus, request the blur region — the path KRunner's own view takes<span class="cur"></span></div><div class="aa"><span class="chipbtn pri">COPY</span><span class="chipbtn">CONTINUE IN CHAT</span><span class="chipbtn">LOCAL-FAST ▾</span></div></div>`:'')+
 [['ask hermes about plasma 6.7 blur behind layer shell'],['ai summarize the omarchy menu format'],['hr check the fleet heartbeat and report gaps']]
  .map(r=>leafRow('',IC.ai,r[0],'','ENTER RE-ASKS')).join('')+
 leafRow('model',IC.ai,'Model','CURRENT: local-fast · AICUBE:4000 · 27B','ENTER CYCLES')+
 `</div>`}
function chipsFor(){
 const c=[];if(expanded.apps)c.push('Apps');
 const cat=Object.keys(CATS).find(k=>expanded[k]);if(cat)c.push(cat);
 const lanes={ai:'AI',fleet:'Fleet',ssh:'SSH',snippets:'Snippets',settings:'Settings',system:'System'};
 for(const k in lanes)if(expanded[k])c.push(lanes[k]);
 const f=$('q').value.trim();
 $('chips').classList.toggle('on',c.length>0||!!f);
 $('chips').innerHTML=c.map(x=>`<span class="sc">${x}</span>`).join('')+
  (f?`<span class="flt">“${f}”</span>`:'')+
  ((c.length||f)?`<span class="clr" id="clr">⌫ CLEAR</span>`:'');
 const el=$('clr');if(el)el.onclick=()=>{expanded={};$('q').value='';render()};
}
function render(){const f=$('q').value.trim();$('list').innerHTML=rootList(f);chipsFor()}
/* interaction: click toggles branches */
$('list').addEventListener('click',e=>{
 const r=e.target.closest('.row');if(!r)return;
 const id=r.dataset.id;
 if(id==='ask'){expanded.ask=!expanded.ask;render();return}
 if(id&&CATS[id]!==undefined||id==='apps'||id==='favs'||id==='ai'||id==='fleet'||id==='ssh'||id==='snippets'||id==='settings'||id==='system'){
  expanded[id]=!expanded[id];if(expanded[id])selId=id;render()}});
$('q').addEventListener('input',render);
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){$('q').value='';expanded={};render()}
 if(e.key==='Backspace'&&e.target===$('q')&&!$('q').value&&Object.keys(expanded).length){e.preventDefault();expanded={};render()}});
/* boot: apps fanned open — foyer root, one flow */
expanded={apps:true};
render();
setTimeout(()=>$('q').focus(),50);
</script>
